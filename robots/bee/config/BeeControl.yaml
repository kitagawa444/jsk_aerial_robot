aerial_robot_control_name: aerial_robot_control/bee_controller

controller:
  torque_allocation_matrix_inv_pub_interval: 0.05
  wrench_allocation_matrix_pub_interval: 0.1
  gimbal_calc_in_fc : true
  gimbal_angle_calc_in_fc : true
  # Keep the hardware default unchanged until the actuator-rate limits have
  # been identified on the real servos and motors.
  allocation_mode: static

  differential_allocation:
    damping: 0.03
    wrench_error_gain: 20.0
    wrench_rate_feedforward_gain: 1.0
    wrench_rate_filter: 0.15
    force_weight: 1.0
    torque_weight: 5.0
    thrust_rate_weight: 1.0
    servo_rate_weight: 5.0
    servo_center_gain: 0.2
    thrust_balance_gain: 0.1
    max_thrust_rate: 40.0
    max_servo_rate: 4.0
    max_servo_acceleration: 30.0
    min_servo_angle: -4.0
    max_servo_angle: 4.0
    servo_angle_limit_enabled: false

  xy:
    p_gain: 3.5
    i_gain: 0.4
    d_gain: 4.5
    limit_sum: 4.0
    limit_p: 112.0
    limit_i: 112.0
    limit_d: 112.0

  z:
    p_gain: 5.0
    i_gain: 2.5
    d_gain: 5.0
    limit_err_p: 1.0
    limit_sum: 25.0 # N for clamping thrust force
    limit_p: 125.0
    limit_i: 125.0
    limit_d: 125.0
    force_landing_descending_rate: -0.5

  roll_pitch:
    p_gain: 43.0
    i_gain: 8.5
    d_gain: 15.5
    limit_sum: 130.0
    limit_p: 130.0
    limit_i: 130.0
    limit_d: 130.0

    start_rp_integration_height: 0.01

  yaw:
    p_gain: 10.0
    i_gain: 1.5
    d_gain: 4.0
    limit_err_p: 0.5
    limit_sum: 20.0
    limit_p: 120.0
    limit_i: 120.0
    limit_d: 210.0

    need_d_control: true
