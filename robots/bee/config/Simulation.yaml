# overwrite parameter for simulation

sensor_plugin:
  mocap:
    ground_truth_sub_name: ground_truth
  gps:
    estimate_mode: 4 #1 << 2
    ned_flag: true # hector_gazebo_plugins/GPS

# ground truth parameter
# global namespace
simulation:
  # The four physical spring feet are passive MuJoCo-only joints. Their
  # compression is exposed by MuJoCo sensors instead of joint_states.
  ignored_mujoco_joint_prefixes: [spring_foot_]
  # Publish physical-foot ForceLists and grasp aliases (period in seconds).
  force_sensor_pub_rate: 0.01
  # Allow high-preload grasp experiments through mujoco/external_wrench.
  external_force_limit: 40.0
  external_wrench_timeout: 1.0

  # gaussian noise
  ground_truth_pos_noise: 0.001
  ground_truth_vel_noise: 0.005
  ground_truth_rot_noise: 0.001
  ground_truth_angular_noise: 0.005

  # drift model: e^(-dt * drift_frequency) * curr_drift + dt * gaussian_kernel(sqrt( 2 * drift_frequency) * drfit))
  # drift diviation:
  ground_truth_vel_drift: 0.1
  ground_truth_rot_drift: 0.1
  ground_truth_angular_drift: 0.01

  # drift frequency:
  ground_truth_vel_drift_frequency: 1
  ground_truth_rot_drift_frequency: 1
  ground_truth_angular_drift_frequency: 0.01
