  - name: bee3
    pos: [1.11547, -0.29278, 0.0]
    quat: [0.5, 0.0, 0.0, 0.8660254]
  - name: bee4
    pos: [1.6, -0.4, 0.0]
    quat: [0.7071068, 0.0, 0.0, 0.7071068]

objects:
