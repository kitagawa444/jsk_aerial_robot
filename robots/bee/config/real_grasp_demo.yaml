# EXAMPLE ONLY: replace geometry/mass/frames with measurements before enabling.
execute: false
configuration_verified: false
object_pose_topic: /mocap/grasp_object/pose
world_frame: world
robot_namespaces: {bee1: bee1, bee2: bee2, bee3: bee3}
cog_frames: {bee1: bee1/cog, bee2: bee2/cog, bee3: bee3/cog}
