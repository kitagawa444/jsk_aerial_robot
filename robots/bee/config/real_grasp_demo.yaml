target_normal_force: 1.0
minimum_normal_force: 0.0
maximum_normal_force: 4.0
keyboard_force_step: 0.1
initial_z_velocity: 0.0
keyboard_z_velocity_step: 0.005
maximum_abs_z_velocity: 0.02
translation_velocity_limit: 0.02
translation_z_velocity_limit: 0.01
keyboard_translation_velocity_step: 0.005
