# Sensor Fuser Loader
estimation:
        # sensor plugin
        sensor_list:
        - sensor_plugin/imu
        - sensor_plugin/mocap
        - sensor_plugin/vo

        # egomotion estimation
        egomotion_list:
        - kalman_filter/kf_pos_vel_acc
        - kalman_filter/kf_pos_vel_acc
        - kalman_filter/kf_pos_vel_acc

        # experiment estimation
        experiment_list:
        - kalman_filter/kf_pos_vel_acc
        - kalman_filter/kf_pos_vel_acc
        - kalman_filter/kf_pos_vel_acc

        # specific id(int) of sensor fuser, axis for kf
        fuser_egomotion_id1: 8 # 1 << 3
        fuser_egomotion_id2: 16 # 1 << 4
        fuser_egomotion_id3: 32 # 1 << 5

        fuser_experiment_id1: 8 # 1 << 3
        fuser_experiment_id2: 16 # 1 << 4
        fuser_experiment_id3: 32 # 1 << 5

        # specific name of sensor fuser
        fuser_egomotion_name1: /ee/x
        fuser_egomotion_name2: /ee/y
        fuser_egomotion_name3: /ee/z

        fuser_experiment_name1: /ex/x
        fuser_experiment_name2: /ex/y
        fuser_experiment_name3: /ex/z


# EGOMOTION_ESTIMATION_MODE = 0
# EXPERIMENT_MODE = 1
# GROUND_TRUTH_MODE = 2

sensor_plugin:
        imu:
                estimate_mode: 3 # 1<<0 + 1<<1
        mocap:
                estimate_mode: 6 # 1<<1 + 1<<2
        vo1:
                estimate_mode: 1 # 1<<0
                # fusion_mode: 2 # ONLY_POS_MODE = 0, ONLY_VEL_MODE = 1, POS_VEL_MODE = 2 (default)
                # param_verbose: true
                throttle_rate: 120 # Hz
                downwards_vo_min_height: 0.1
        gicp:
                estimate_mode: 1
                localization_freq: 2.0
                oneshot: false
                reverse_tf: false
                initial_guess:
                        pos: [0.0, 0.0, 0.0]
                        rpy: [0.0, 0.0, 0.0]
                registration:
                        init:
                                map_voxel_size: 0.4
                                scan_voxel_size: 0.1
                                max_corres_dist: 1.0
                                localization_thresh: 0.6
                                map_range: 15.0
                                scan_range: 8.0
                        float:
                                map_voxel_size: 0.3
                                scan_voxel_size: 0.1
                                max_corres_dist: 0.6
                                localization_thresh: 0.75
                                map_range: 12.0
                                scan_range: 6.0
                        fix:
                                map_voxel_size: 0.2
                                scan_voxel_size: 0.1
                                max_corres_dist: 0.3
                                localization_thresh: 0.85
                                map_range: 10.0
                                scan_range: 5.0

