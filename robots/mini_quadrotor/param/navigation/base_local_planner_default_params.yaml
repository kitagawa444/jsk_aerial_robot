DWAPlannerROS:
  max_vel_trans: 1.80
  min_vel_trans: -1.80
  # max_trans_vel: 0.50
  # min_trans_vel: 0.1
  max_vel_x: 1.8
  min_vel_x: -1.8
  max_vel_y: 1.8
  min_vel_y: -1.8
  max_rot_theta: 0.01
  min_rot_theta: -0.01
  acc_lim_x: 3.0
  acc_lim_y: 3.0
  acc_lim_theta: 0.1
  acc_lim_trans: 3.0
  prune_plan: false

  xy_goal_tolerance: 0.20
  yaw_goal_tolerance: 3.14 # no yaw tracking, 0.1
  latch_xy_goal_tolerance: true
  trans_stopped_vel: 0.2
  rot_stopped_vel: 0.2
  sim_time: 2.5
  sim_granularity: 0.05
  angular_sim_granularity: 0.05
  path_distance_bias: 32.0
  goal_distance_bias: 20.0
  occdist_scale: 0.6
  twirling_scale: 0.0
  stop_time_buffer: 0.5
  oscillation_reset_dist: 0.10
  oscillation_reset_angle: 0.4
  forward_point_distance: 0.3
  scaling_speed: 0.25
  max_scaling_factor: 0.2
  vx_samples: 20
  vy_samples: 20
  vth_samples: 4

  use_dwa: true
  restore_defaults: False
  recovery_behavior_enabled: false