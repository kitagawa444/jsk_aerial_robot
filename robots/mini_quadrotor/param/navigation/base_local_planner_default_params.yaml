DWAPlannerROS:
  max_vel_trans: 0.30
  min_vel_trans: -0.30
  # max_trans_vel: 0.50
  # min_trans_vel: 0.1
  max_vel_x: 0.3
  min_vel_x: -0.3
  max_vel_y: 0.3
  min_vel_y: -0.3
  max_rot_theta: 0.01
  min_rot_theta: -0.01
  acc_lim_x: 0.8
  acc_lim_y: 0.8
  acc_lim_theta: 0.1
  acc_lim_trans: 0.8
  prune_plan: false

  xy_goal_tolerance: 0.10
  yaw_goal_tolerance: 3.14 # no yaw tracking, 0.1
  latch_xy_goal_tolerance: true
  trans_stopped_vel: 0.1
  rot_stopped_vel: 0.1
  sim_time: 3.0
  sim_granularity: 0.1
  angular_sim_granularity: 0.1
  path_distance_bias: 34.0
  goal_distance_bias: 24.0
  occdist_scale: 0.05
  twirling_scale: 0.0
  stop_time_buffer: 0.5
  oscillation_reset_dist: 0.05
  oscillation_reset_angle: 0.2
  forward_point_distance: 0.3
  scaling_speed: 0.25
  max_scaling_factor: 0.2
  vx_samples: 20
  vy_samples: 20
  vth_samples: 4

  use_dwa: true
  restore_defaults: False
  recovery_behavior_enabled: false